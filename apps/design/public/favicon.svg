<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Abyss square (Navy Electric) — favicon holds against any browser chrome. -->
  <rect width="64" height="64" rx="14" fill="oklch(22% 0.23 270)" />
  <!-- Drift mark, white opacity strata, scaled into 70% inset of the square. -->
  <g transform="translate(9.6 9.6) scale(0.7)">
    <rect x="2" y="2" width="38" height="38" rx="7" fill="#ffffff" opacity="0.30" />
    <rect x="13" y="13" width="38" height="38" rx="7" fill="#ffffff" opacity="0.62" />
    <rect x="24" y="24" width="38" height="38" rx="7" fill="#ffffff" />
    <!-- Three "data bars" on the front face. -->
    <rect x="32" y="40" width="22" height="2" rx="1" fill="oklch(22% 0.23 270)" opacity="0.35" />
    <rect x="32" y="46" width="22" height="2" rx="1" fill="oklch(22% 0.23 270)" opacity="0.35" />
    <rect x="32" y="52" width="22" height="2" rx="1" fill="oklch(22% 0.23 270)" opacity="0.35" />
  </g>
</svg>
