# The backend's deployed environments (03 §2; 14 §6), through alchemy (infra/app.ts).
#
#   pull request (same repo)  -> build the console, deploy stage pr-<n> (Neon branch, Hyperdrive, API, console),
#                                migrate that branch, smoke the console
#   push to staging           -> migrate nonprod main, deploy stage staging, smoke
#   push to main              -> migrate prod main, deploy stage production, smoke
#
# Migrations run before the deploy: they are expand-only, so the running code keeps working on the new schema.
# `main` only takes a release from staging or a hotfix (docs/branches.md). The design reference keeps ci.yml.
name: backend

on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

env:
  WORKERS_SUBDOMAIN: ishak-73d.workers.dev

jobs:
  preview:
    name: backend · preview
    # Fork PRs get no secrets, and their code should not reach the account.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: preview
      url: https://insyte-console-pr-${{ github.event.pull_request.number }}.${{ env.WORKERS_SUBDOMAIN }}/status
    # alchemy has no state locking: one deploy per stage at a time, never cancelled midway.
    concurrency:
      group: alchemy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      INSYTE_APP_DB_PASSWORD: ${{ secrets.INSYTE_APP_DB_PASSWORD }}
      GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
      STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run --filter @insyte/console build
      # alchemy is installed in infra/, with its Effect peers; `bunx` from the root would fetch a bare copy.
      - run: bunx alchemy provider check-env --config app.ts
        working-directory: infra
      # Provisions the account's state store the first time, adopts it after.
      - run: bunx alchemy state bootstrap --config app.ts --no-input
        working-directory: infra
      - run: bunx alchemy deploy app.ts --stage "$STAGE" --yes --no-input
        working-directory: infra
      - name: migrate the preview's branch
        run: bun run db:migrate --env preview --host "$(bun scripts/neon-branch-host.ts "$STAGE")"
        env:
          INSYTE_OWNER_DB_PASSWORD: ${{ secrets.INSYTE_OWNER_DB_PASSWORD }}
      - name: smoke the preview
        run: |
          url="https://insyte-console-$STAGE.$WORKERS_SUBDOMAIN/status"
          for _ in $(seq 1 20); do
            if curl -fsS "$url" | grep -q 'data-testid="database"><span[^>]*>ok<'; then echo "$url: database ok"; exit 0; fi
            sleep 6
          done
          echo "$url never said the database is ok"; curl -sS "$url" | head -c 2000; exit 1

  staging:
    name: backend · staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: https://insyte-console-staging.${{ env.WORKERS_SUBDOMAIN }}/status
    concurrency:
      group: alchemy-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      DATABASE_HOST: ${{ vars.DATABASE_HOST }}
      INSYTE_APP_DB_PASSWORD: ${{ secrets.INSYTE_APP_DB_PASSWORD }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run --filter @insyte/console build
      - run: bunx alchemy provider check-env --config app.ts
        working-directory: infra
      - run: bun run db:migrate --env staging
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
      - run: bunx alchemy deploy app.ts --stage staging --yes --no-input
        working-directory: infra
      - name: smoke staging
        run: |
          url="https://insyte-console-staging.$WORKERS_SUBDOMAIN/status"
          for _ in $(seq 1 20); do
            if curl -fsS "$url" | grep -q 'data-testid="database"><span[^>]*>ok<'; then echo "$url: database ok"; exit 0; fi
            sleep 6
          done
          echo "$url never said the database is ok"; curl -sS "$url" | head -c 2000; exit 1

  production:
    name: backend · production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://insyte-console-production.${{ env.WORKERS_SUBDOMAIN }}/status
    concurrency:
      group: alchemy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      DATABASE_HOST: ${{ vars.DATABASE_HOST }}
      INSYTE_APP_DB_PASSWORD: ${{ secrets.INSYTE_APP_DB_PASSWORD }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run --filter @insyte/console build
      - run: bunx alchemy provider check-env --config app.ts
        working-directory: infra
      - run: bun run db:migrate --env production
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
      - run: bunx alchemy deploy app.ts --stage production --yes --no-input
        working-directory: infra
      - name: smoke production
        run: |
          url="https://insyte-console-production.$WORKERS_SUBDOMAIN/status"
          for _ in $(seq 1 20); do
            if curl -fsS "$url" | grep -q 'data-testid="database"><span[^>]*>ok<'; then echo "$url: database ok"; exit 0; fi
            sleep 6
          done
          echo "$url never said the database is ok"; curl -sS "$url" | head -c 2000; exit 1
