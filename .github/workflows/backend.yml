# The backend's deployed environments (03 §2; 14 §6), through alchemy (infra/app.ts).
#
#   pull request (same repo)  -> preview-base (infra/previews.ts), build the console, deploy stage pr-<n> (a Neon
#                                branch of preview-base, Hyperdrive, API, console), migrate that branch, smoke
#   push to staging           -> migrate nonprod main, deploy stage staging, smoke, refresh preview-base
#   push to main              -> migrate prod main, deploy stage production, smoke
#
# Migrations run before the deploy: they are expand-only, so the running code keeps working on the new schema.
# `main` only takes a release from staging or a hotfix (docs/branches.md). The design reference keeps ci.yml.
#
# GitHub holds the deploy's own credentials only. What a stage is configured with is committed (infra/stages.ts); the
# API Worker's secrets are set on the Worker (scripts/worker-secrets.ts), and a deploy leaves them alone.
name: backend

on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

env:
  WORKERS_SUBDOMAIN: ishak-73d.workers.dev
  # Not secrets: the account every stage deploys to, and Sentry's public DSN for the console's build (infra/stages.ts).
  CLOUDFLARE_ACCOUNT_ID: 73dfc33e7ece69bbe79129899d8d585d
  VITE_SENTRY_DSN: https://65513f695782e21ed6d46a02e779d973@o4511614812160000.ingest.de.sentry.io/4512391663714384

jobs:
  shared:
    name: backend · shared
    # What the account holds once (infra/shared.ts): Sentry destinations. Every stage's deploy waits for it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ github.event_name == 'pull_request' && 'preview' || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    concurrency:
      group: alchemy-shared
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx alchemy deploy shared.ts --stage shared --yes --no-input
        working-directory: infra

  preview-base:
    name: backend · preview-base
    # What every preview's database forks (infra/previews.ts): staging's schema and the three scenario workspaces. A new
    # one is emptied of main's rows and seeded here; staging's run migrates and reseeds it afterwards.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview
    concurrency:
      group: alchemy-previews
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx alchemy deploy previews.ts --stage nonprod --yes --no-input
        working-directory: infra
      - run: bun scripts/preview-base.ts --first
        env:
          INSYTE_OWNER_DB_PASSWORD: ${{ secrets.INSYTE_OWNER_DB_PASSWORD }}

  preview:
    name: backend · preview
    needs: [shared, preview-base]
    # Fork PRs get no secrets, and their code should not reach the account.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: preview
      url: https://insyte-console-pr-${{ github.event.pull_request.number }}.${{ env.WORKERS_SUBDOMAIN }}/status
    # alchemy has no state locking: one deploy per stage at a time, never cancelled midway.
    concurrency:
      group: alchemy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      INSYTE_APP_DB_PASSWORD: ${{ secrets.INSYTE_APP_DB_PASSWORD }}
      GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
      STAGE: pr-${{ github.event.pull_request.number }}
      # The console's build reads these (Vite): Sentry in the browser, tagged with the environment and the commit.
      VITE_ENVIRONMENT: preview
      VITE_VERSION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run --filter @insyte/console build
        env:
          # Uploads the browser source maps to Sentry, then deletes them from the build.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # alchemy is installed in infra/, with its Effect peers; `bunx` from the root would fetch a bare copy.
      - run: bunx alchemy provider check-env --config app.ts
        working-directory: infra
      # Provisions the account's state store the first time, adopts it after.
      - run: bunx alchemy state bootstrap --config app.ts --no-input
        working-directory: infra
      - run: bunx alchemy deploy app.ts --stage "$STAGE" --yes --no-input
        working-directory: infra
      - name: migrate the preview's branch
        run: bun run db:migrate --env preview --host "$(bun scripts/neon-branch-host.ts "$STAGE")"
        env:
          INSYTE_OWNER_DB_PASSWORD: ${{ secrets.INSYTE_OWNER_DB_PASSWORD }}
      - name: the scenario workspaces are there
        run: bun run db:seed --env preview --host "$(bun scripts/neon-branch-host.ts "$STAGE")" --check
        env:
          INSYTE_OWNER_DB_PASSWORD: ${{ secrets.INSYTE_OWNER_DB_PASSWORD }}
      - name: smoke the preview
        # Past Access with the CI service token.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bun scripts/smoke-stage.ts "https://insyte-console-$STAGE.$WORKERS_SUBDOMAIN" --auth-journey
      # The console's journeys (step 1's `@auth`) in a browser, on the preview, against its own Neon branch.
      - run: bunx playwright install --with-deps chromium
      - name: the console's journeys on the preview
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: CONSOLE_URL="https://insyte-console-$STAGE.$WORKERS_SUBDOMAIN" bun run e2e:console
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-console
          path: playwright-report-console
          retention-days: 7

  staging:
    name: backend · staging
    needs: shared
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: https://insyte-console-staging.${{ env.WORKERS_SUBDOMAIN }}/status
    concurrency:
      group: alchemy-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      INSYTE_APP_DB_PASSWORD: ${{ secrets.INSYTE_APP_DB_PASSWORD }}
      GITHUB_SHA: ${{ github.sha }}
      # The console's build reads these (Vite): Sentry in the browser, tagged with the environment and the commit.
      VITE_ENVIRONMENT: staging
      VITE_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run --filter @insyte/console build
        env:
          # Uploads the browser source maps to Sentry, then deletes them from the build.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - run: bunx alchemy provider check-env --config app.ts
        working-directory: infra
      - run: bun run db:migrate --env staging
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
      - run: bunx alchemy deploy app.ts --stage staging --yes --no-input
        working-directory: infra
      # Once, while GitHub still has them: the secrets this deploy stopped uploading, onto the Worker (worker-secrets.ts).
      # Removed with the secrets themselves once they are on both Workers.
      - name: hand the Worker its secrets
        run: bun scripts/worker-secrets.ts staging
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SEAL_KEYS: ${{ secrets.SEAL_KEYS }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          KLAVIYO_CLIENT_ID: ${{ secrets.KLAVIYO_CLIENT_ID }}
          KLAVIYO_CLIENT_SECRET: ${{ secrets.KLAVIYO_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AFTERSHIP_API_KEY: ${{ secrets.AFTERSHIP_API_KEY }}
          AFTERSHIP_WEBHOOK_SECRET: ${{ secrets.AFTERSHIP_WEBHOOK_SECRET }}
          SENDCLOUD_PUBLIC_KEY: ${{ secrets.SENDCLOUD_PUBLIC_KEY }}
          SENDCLOUD_SECRET_KEY: ${{ secrets.SENDCLOUD_SECRET_KEY }}
      - name: smoke staging
        # Past Access with the CI service token.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bun scripts/smoke-stage.ts "https://insyte-console-staging.$WORKERS_SUBDOMAIN"
      # What the next previews fork: staging's migrations and the scenario workspaces (infra/previews.ts).
      - name: refresh preview-base
        run: bun scripts/preview-base.ts
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}

  production:
    name: backend · production
    needs: shared
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://insyte-console-production.${{ env.WORKERS_SUBDOMAIN }}/status
    concurrency:
      group: alchemy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      INSYTE_APP_DB_PASSWORD: ${{ secrets.INSYTE_APP_DB_PASSWORD }}
      GITHUB_SHA: ${{ github.sha }}
      # The console's build reads these (Vite): Sentry in the browser, tagged with the environment and the commit.
      VITE_ENVIRONMENT: production
      VITE_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run --filter @insyte/console build
        env:
          # Uploads the browser source maps to Sentry, then deletes them from the build.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - run: bunx alchemy provider check-env --config app.ts
        working-directory: infra
      - run: bun run db:migrate --env production
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
      - run: bunx alchemy deploy app.ts --stage production --yes --no-input
        working-directory: infra
      # Once, while GitHub still has them: the secrets this deploy stopped uploading, onto the Worker (worker-secrets.ts).
      # Removed with the secrets themselves once they are on both Workers.
      - name: hand the Worker its secrets
        run: bun scripts/worker-secrets.ts production
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SEAL_KEYS: ${{ secrets.SEAL_KEYS }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          KLAVIYO_CLIENT_ID: ${{ secrets.KLAVIYO_CLIENT_ID }}
          KLAVIYO_CLIENT_SECRET: ${{ secrets.KLAVIYO_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AFTERSHIP_API_KEY: ${{ secrets.AFTERSHIP_API_KEY }}
          AFTERSHIP_WEBHOOK_SECRET: ${{ secrets.AFTERSHIP_WEBHOOK_SECRET }}
          SENDCLOUD_PUBLIC_KEY: ${{ secrets.SENDCLOUD_PUBLIC_KEY }}
          SENDCLOUD_SECRET_KEY: ${{ secrets.SENDCLOUD_SECRET_KEY }}
      - name: smoke production
        # Past Access with the CI service token.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bun scripts/smoke-stage.ts "https://insyte-console-production.$WORKERS_SUBDOMAIN"
