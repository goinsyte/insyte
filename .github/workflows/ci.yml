# The pipeline: gate every change, then deploy the design reference through three environments.
#
#   pull request     -> preflight + build + journey -> preview     (pr-<n>-insyte-design-staging)
#   push to staging  -> preflight + build + journey -> staging     (insyte-design-staging)
#   push to main     -> preflight + build + journey -> production  (insyte-design)
#
# Work merges into `staging`; `main` only takes a release pull request from `staging` or a hotfix
# (docs/branches.md), so a push to `main` is always a deliberate release.
# Every deployed hostname sits behind Cloudflare Access, so a preview is as private as production.
# Pinned to ubuntu-24.04: `ubuntu-latest` moved to 26.04, where Playwright cannot install Chromium yet.
# What each environment needs on GitHub and in Cloudflare is in docs/ci.md.
name: ci

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  # One run per branch or PR; a newer push replaces an older run that has not finished.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WORKERS_SUBDOMAIN: ishak-73d.workers.dev

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The route trees (`routeTree.gen.ts`) are generated by the router plugin during a build and are not
      # committed, so a clean checkout has none and `tsc` cannot resolve a single route. Building writes them.
      - run: bun run --filter @insyte/design build && bun run --filter @insyte/marketing build && bun run --filter @insyte/console build
      # migrations:check compares the manifest with the branch work merges into.
      - run: git fetch --no-tags --depth=1 origin staging
      # The database and worker tests run against Postgres as insyte_app: the compose container, migrated.
      - run: bun run db:up && bun run db:migrate --local
      # format:check, check (tsc), lint, hygiene (knip, syncpack, secretlint), unit tests.
      - run: bun run preflight:ci
      # The API Worker as it really starts, under wrangler dev: what the in-test harness cannot see.
      - run: bun run api:smoke
      # The built console with the API beside it: the walking skeleton's page, server-rendered from Postgres.
      - run: bun run console:smoke

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run --filter @insyte/design build
      # Built to prove it builds; the marketing Worker has no deploy target yet.
      - run: bun run --filter @insyte/marketing build
      - run: bun run --filter @insyte/console build
      - uses: actions/upload-artifact@v4
        with:
          name: design-dist
          path: apps/design/dist
          retention-days: 7

  journey:
    name: journey (e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # Builds the reference and serves the production bundle (playwright.config.ts).
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  preview:
    name: deploy · preview
    # Not for forks: their runs get no secrets, and their code should not reach the account.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [preflight, build, journey]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}-insyte-design-staging.${{ env.WORKERS_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: design-dist
          path: apps/design/dist
      # A version of the staging Worker under a stable alias; staging itself keeps serving the staging branch.
      - run: bunx wrangler versions upload --env staging --preview-alias "pr-$PR" --message "PR $PR at $SHA"
        working-directory: apps/design
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  staging:
    name: deploy · staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [preflight, build, journey]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://insyte-design-staging.${{ env.WORKERS_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: design-dist
          path: apps/design/dist
      - run: bunx wrangler deploy --env staging --message "staging $GITHUB_SHA"
        working-directory: apps/design
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  production:
    name: deploy · production
    # The free plan has no required reviewers on a private repo, so the gate is the merge into `main`:
    # a release from `staging` (already deployed and checked there) or a hotfix, merged by a maintainer.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [preflight, build, journey]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://insyte-design.${{ env.WORKERS_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: design-dist
          path: apps/design/dist
      - run: bunx wrangler deploy --message "main $GITHUB_SHA"
        working-directory: apps/design
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
