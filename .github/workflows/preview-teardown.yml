# A closed pull request's preview goes away: Workers, Hyperdrive and the Neon branch (14 §4). The branch also expires
# after seven days on its own, so a teardown that never ran costs nothing for long.
name: preview teardown

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  teardown:
    name: preview · teardown
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preview
    concurrency:
      group: alchemy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      INSYTE_APP_DB_PASSWORD: ${{ secrets.INSYTE_APP_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx alchemy destroy infra/app.ts --stage "pr-${{ github.event.pull_request.number }}" --yes --no-input
