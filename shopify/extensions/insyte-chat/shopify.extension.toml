# with the app (`shopify app deploy --path shopify`); the operator turns it on in the theme editor (App embeds), which
# Instellingen → Koppelingen → Websitechat opens for them. The widget's welcome text and colour are set in Insyte.
name = "insyte-chat"
type = "theme"
