pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,json,jsonc,md}"
      run: bunx dprint check --allow-no-files {staged_files}
    lint:
      glob: "*.{ts,tsx}"
      run: bunx oxlint --disable-nested-config --no-error-on-unmatched-pattern {staged_files}
    secrets:
      run: bunx secretlint --secretlintignore .secretlintignore {staged_files}
    scope:
      run: bun scripts/scope.ts

pre-push:
  commands:
    branches:
      run: bun scripts/branches.ts
    scope:
      run: bun scripts/scope.ts --base origin/staging
    check:
      run: bun run check
